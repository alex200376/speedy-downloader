<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="logo">⚡</div>
        <div class="brand">
          <div class="name">SpeedDownloader</div>
          <div class="status">
            <span id="dot" class="dot off"></span>
            <span id="statusText">…</span>
          </div>
        </div>
      </header>

      <div class="input-group">
        <input
          id="urlInput"
          type="text"
          placeholder="Paste URL or magnet link…"
          spellcheck="false"
        />
        <button id="grabBtn" class="btn-primary">Download</button>
      </div>

      <div class="quick-actions">
        <button id="grabVideoBtn" class="btn-secondary">
          <span class="btn-icon">🎬</span> Video
        </button>
        <button id="grabPlaylistBtn" class="btn-secondary">
          <span class="btn-icon">📋</span> Playlist
        </button>
      </div>

      <label class="toggle-row">
        <input id="autoGrab" type="checkbox" />
        <span class="toggle-track"></span>
        <span id="autoGrabText">Auto-grab downloads</span>
      </label>

      <details class="settings" id="settingsPanel">
        <summary>Settings</summary>
        <div class="settings-body">
          <input id="tokenInput" type="password" placeholder="API Token…" spellcheck="false" />
          <div class="token-hint" id="tokenHint">Copy from app: Settings → Extension</div>
        </div>
      </details>

      <div class="tasks">
        <div class="tasks-header">
          <span class="tasks-title" id="tasksTitle">Recent Tasks</span>
          <span class="task-count" id="taskCount"></span>
        </div>
        <div id="taskList" class="task-list"></div>
        <div id="taskEmpty" class="task-empty">
          <div class="empty-icon">⚡</div>
          <p>No tasks yet</p>
        </div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
